<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lofi Code Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       MARK: - Global Variables & Reset
       ========================================================================== */
    :root {
      --ink: #f7efe4;
      --mute: #cfc4dc;
      --accent: #ffb892;
      --glass: rgba(28, 22, 44, 0.65);
      --glass-hover: rgba(40, 32, 60, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #1d1a2b;
      color: var(--ink);
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================================================
       MARK: - Background Video & Scenic Layers
       ========================================================================== */
    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transform: scale(1.01);
    }

    .shade {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(18, 14, 28, 0.55) 85%),
                  linear-gradient(to top, rgba(18, 14, 28, 0.85) 0%, transparent 30%),
                  linear-gradient(to bottom, rgba(18, 14, 28, 0.5) 0%, transparent 20%);
      pointer-events: none;
      z-index: 1;
    }


    /* ==========================================================================
       MARK: - Top Header & Status Badges
       ========================================================================== */
    .top {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }

    .brand {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .brand b {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 99px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--mute);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .pill.interactive {
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .pill.interactive:hover {
      background: var(--glass-hover);
      color: var(--ink);
    }

    /* ==========================================================================
       MARK: - Floating Reactions & Good Vibes Styles
       ========================================================================== */
    #floating-emojis-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      overflow: hidden;
    }

    .floating-emoji {
      position: absolute;
      bottom: 80px;
      font-size: 28px;
      user-select: none;
      pointer-events: none;
      animation: floatUpAndDrift 2.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    @keyframes floatUpAndDrift {
      0% {
        transform: translateY(0) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 1;
        transform: translateY(-35px) scale(1.15) rotate(-6deg);
      }
      75% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(-280px) scale(1.4) rotate(10deg);
        opacity: 0;
      }
    }

    .reaction-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reaction-btn {
      background: none;
      border: 0;
      font-size: 15px;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 8px;
      transition: transform 0.18s ease, filter 0.18s ease;
      line-height: 1;
    }

    .reaction-btn:hover {
      transform: scale(1.35) translateY(-2px);
      filter: drop-shadow(0 2px 6px rgba(255, 184, 146, 0.6));
    }

    .reaction-btn:active {
      transform: scale(0.95);
    }

    .live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff5c5c;
      box-shadow: 0 0 8px #ff5c5c;
      animation: pulseLive 1.8s ease-in-out infinite;
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .pill select {
      background: none;
      border: 0;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    .pill select option {
      background: #1c162c;
      color: var(--ink);
    }

    /* ==========================================================================
       MARK: - Main Music Player Bar
       ========================================================================== */
    .player {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      width: min(560px, calc(100vw - 28px));
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .art {
      position: relative;
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: url('/assets/aistudio/lofi_chill_poster.jpg') center/cover no-repeat;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .bars {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 16px;
      z-index: 2;
    }

    .bars span {
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 1px;
      transition: height 0.2s;
    }

    .playing .bars span {
      animation: equalize 0.85s ease-in-out infinite alternate;
    }

    .bars span:nth-child(2) { animation-delay: -0.28s !important; }
    .bars span:nth-child(3) { animation-delay: -0.55s !important; }
    .bars span:nth-child(4) { animation-delay: -0.15s !important; }

    @keyframes equalize {
      0% { height: 3px; }
      100% { height: 16px; }
    }

    .meta {
      min-width: 0;
      flex: 1;
    }

    .title {
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);
    }

    .artist {
      color: var(--mute);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .btn {
      background: none;
      border: 0;
      color: var(--mute);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: color 0.15s, transform 0.15s;
    }

    .btn:hover {
      color: var(--ink);
      transform: scale(1.08);
    }

    .ic {
      font-size: 16px;
      line-height: 1;
    }

    .play {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: #2a1b2e;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s, background-color 0.15s;
      box-shadow: 0 4px 14px rgba(255, 184, 146, 0.4);
    }

    .play:hover {
      transform: scale(1.08);
      background-color: #ffa67a;
    }

    .play svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .vol {
      width: 72px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .prog {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      font: 400 11px 'JetBrains Mono', monospace;
      color: var(--mute);
    }

    .track {
      flex: 1;
      height: 5px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.18);
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .track i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 9px;
      transition: width 0.15s linear;
    }

    .hist {
      display: none;
      margin: 10px 0 0;
      padding: 10px 0 0;
      border-top: 1px solid var(--border);
      list-style: none;
      font-size: 13px;
    }

    .hist.open {
      display: block;
    }

    .hist li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
      color: var(--mute);
    }

    .hist li b {
      color: var(--ink);
      font-weight: 700;
    }

    /* Notification toast */
    .note {
      position: fixed;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      font-size: 13px;
      color: var(--ink);
      background: rgba(28, 22, 44, 0.94);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 99px;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
      pointer-events: none;
      z-index: 30;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .note.show {
      opacity: 1;
    }

    @media (max-width: 520px) {
      .vol, .visitor-pill { display: none; }
      .title { font-size: 14px; }
      .player { width: calc(100vw - 20px); padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <!-- Floating Reaction Emojis Overlay Container -->
  <div id="floating-emojis-container"></div>

  <!-- ========================================================================
       MARK: - Background Video Scene
       ======================================================================== -->
  <div class="scene">
    <video
      id="bg-video"
      class="bg-video"
      src="/assets/aistudio/lofi_chill_49a2c32d.mp4"
      poster="/assets/aistudio/lofi_chill_poster.jpg"
      autoplay
      loop
      muted
      playsinline
    ></video>
  </div>

  <div class="shade"></div>

  <!-- ========================================================================
       MARK: - Top Header Navigation & Good Vibes Reactions
       ======================================================================== -->
  <header class="top">
    <div class="brand"><b>&lt;/&gt;</b> Lofi Code Radio</div>
    <div class="header-actions">
      <!-- Live Visitor Counter Badge -->
      <div class="pill visitor-pill" title="Active Visitors and Listeners">
        <span style="font-size: 13px;">👥</span>
        <span id="visitor-count">1,482 listening</span>
      </div>

      <!-- Good Vibes Floating Reaction Bar -->
      <div class="pill interactive" id="vibe-pill" title="Send a cozy vibe to fellow listeners">
        <span class="reaction-bar">
          <button class="reaction-btn" data-emoji="☕" title="Send Coffee Vibe">☕</button>
          <button class="reaction-btn" data-emoji="✨" title="Send Magic Sparkles">✨</button>
          <button class="reaction-btn" data-emoji="🎧" title="Send Music Vibe">🎧</button>
          <button class="reaction-btn" data-emoji="💻" title="Send Coding Vibe">💻</button>
          <button class="reaction-btn" data-emoji="❤️" title="Send Cozy Heart">❤️</button>
          <button class="reaction-btn" data-emoji="🌧️" title="Send Rainy Mood">🌧️</button>
        </span>
        <span id="vibe-count-label" style="font-weight: 700; color: #ffb892; font-size: 12px; margin-left: 2px;">Send Vibe</span>
      </div>

      <!-- Genre Selection -->
      <label class="pill">
        <span class="live"></span>
        <select id="genre" aria-label="Genre"></select>
      </label>
    </div>
  </header>

  <div class="note" id="note">Click Play to start Lo-Fi Radio</div>

  <!-- ========================================================================
       MARK: - Player Dock
       ======================================================================== -->
  <main class="player" id="player">
    <div class="row">
      <div class="art">
        <div class="bars"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="meta">
        <div class="title" id="title">Compile Time</div>
        <div class="artist" id="artist">Midnight Merge &middot; Lo-Fi Chill</div>
      </div>
      <input class="vol" id="vol" type="range" min="0" max="100" value="70" aria-label="Volume">
      <button class="btn ic" id="prev" aria-label="Previous track">⏮</button>
      <button class="play" id="play" aria-label="Play">
        <svg id="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn ic" id="next" aria-label="Next track">⏭</button>
      <button class="btn ic" id="like" aria-label="Like track">♡</button>
    </div>
    <div class="prog">
      <span id="t0">0:00</span>
      <div class="track"><i id="bar"></i></div>
      <span id="t1">3:12</span>
      <button class="btn" id="hbtn">History</button>
    </div>
    <ul class="hist" id="hist"></ul>
  </main>

  <script>
    // ==========================================================================
    // MARK: - Utilities and DOM Elements
    // ==========================================================================
    const $ = id => document.getElementById(id);
    const fm = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
    const say = messageText => {
      const noteElement = $('note');
      noteElement.textContent = messageText;
      noteElement.style.bottom = ($('player').offsetHeight + 24) + 'px';
      noteElement.classList.add('show');
      clearTimeout(say.timer);
      say.timer = setTimeout(() => noteElement.classList.remove('show'), 5000);
    };

    // ==========================================================================
    // MARK: - Video Audio Removal & Autoplay Enforcement
    // ==========================================================================
    const backgroundVideo = $('bg-video');
    if (backgroundVideo) {
      backgroundVideo.muted = true;
      backgroundVideo.volume = 0;
      backgroundVideo.play().catch(err => {
        console.warn('Video autoplay waiting for interaction:', err);
      });
    }


    // ==========================================================================
    // MARK: - Visitor & Live Listener Counter
    // ==========================================================================
    (function initVisitorCounter() {
      const STORAGE_KEY = 'lofi_visitor_stats';
      let stats;
      try {
        stats = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (e) {
        stats = null;
      }
      if (!stats || typeof stats.totalVisits !== 'number') {
        stats = {
          totalVisits: 1480 + Math.floor(Math.random() * 20),
          lastVisitTime: Date.now()
        };
      }
      stats.totalVisits += 1;
      stats.lastVisitTime = Date.now();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
      } catch (e) {}

      const counterElement = $('visitor-count');
      if (counterElement) {
        const baseListeners = Math.max(120, Math.floor(stats.totalVisits * 0.32));
        counterElement.textContent = `${baseListeners.toLocaleString()} listening`;

        setInterval(() => {
          const delta = (Math.random() > 0.48 ? 1 : -1) * Math.floor(Math.random() * 3);
          const current = Math.max(80, baseListeners + delta);
          counterElement.textContent = `${current.toLocaleString()} listening`;
        }, 12000);
      }
    })();

    // ==========================================================================
    // MARK: - Floating Reactions & Good Vibes System
    // ==========================================================================
    (function initGoodVibesSystem() {
      const VIBE_STORAGE_KEY = 'lofi_vibes_total';
      const containerElement = $('floating-emojis-container');
      const vibeLabelElement = $('vibe-count-label');

      // Retrieve persistent vibe count or initialize baseline
      let totalVibesSent = parseInt(localStorage.getItem(VIBE_STORAGE_KEY) || '342', 10);

      function updateVibeLabelDisplay() {
        if (vibeLabelElement) {
          vibeLabelElement.textContent = `✨ ${totalVibesSent.toLocaleString()} Vibes`;
        }
      }

      /**
       * Spawns an animated floating emoji across the room view.
       * @param {string} emojiSymbol - The emoji character to render.
       * @param {number} startXPercent - Starting horizontal X coordinate percentage (10% to 90%).
       */
      function spawnFloatingEmoji(emojiSymbol, startXPercent) {
        if (!containerElement) return;

        const emojiNode = document.createElement('span');
        emojiNode.className = 'floating-emoji';
        emojiNode.textContent = emojiSymbol;

        const initialX = typeof startXPercent === 'number' ? startXPercent : 15 + Math.random() * 70;
        emojiNode.style.left = `${initialX}%`;
        emojiNode.style.fontSize = `${24 + Math.floor(Math.random() * 12)}px`;

        containerElement.appendChild(emojiNode);

        // Remove element once CSS keyframe animation completes
        setTimeout(() => {
          if (emojiNode.parentNode) {
            emojiNode.parentNode.removeChild(emojiNode);
          }
        }, 2600);
      }

      /**
       * Triggers a Good Vibe reaction event from local user or remote ambient listener.
       * @param {string} emojiSymbol - The emoji reaction symbol.
       * @param {boolean} isLocalUser - Whether triggered directly by current user.
       */
      function sendGoodVibe(emojiSymbol, isLocalUser = true) {
        totalVibesSent += 1;
        try {
          localStorage.setItem(VIBE_STORAGE_KEY, totalVibesSent.toString());
        } catch (e) {}

        updateVibeLabelDisplay();

        if (isLocalUser) {
          // Burst of floating emojis for local user click
          spawnFloatingEmoji(emojiSymbol, 50 + (Math.random() * 20 - 10));
          setTimeout(() => spawnFloatingEmoji(emojiSymbol, 45 + (Math.random() * 30 - 15)), 200);
          say(`You sent a cozy ${emojiSymbol} vibe! ✨`);
        } else {
          // Single floating emoji for ambient remote listener
          spawnFloatingEmoji(emojiSymbol);
        }
      }

      // Bind click handlers to quick reaction emoji buttons
      document.querySelectorAll('.reaction-btn').forEach(button => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          const emojiSymbol = button.getAttribute('data-emoji') || '☕';
          sendGoodVibe(emojiSymbol, true);
        });
      });

      // Bind overall pill click to default vibe
      const vibePill = $('vibe-pill');
      if (vibePill) {
        vibePill.addEventListener('click', () => {
          sendGoodVibe('✨', true);
        });
      }

      // Initial label setup
      updateVibeLabelDisplay();

      // Ambient co-presence simulation: occasional cozy vibes from worldwide listeners
      const ambientVibeEmojis = ['☕', '✨', '🎧', '❤️', '🌧️', '💻'];
      const ambientListenerCities = ['Tokyo', 'London', 'Seattle', 'Berlin', 'Seoul', 'Toronto', 'Paris', 'Austin'];

      setInterval(() => {
        if (Math.random() > 0.35) {
          const randomEmoji = ambientVibeEmojis[Math.floor(Math.random() * ambientVibeEmojis.length)];
          const randomCity = ambientListenerCities[Math.floor(Math.random() * ambientListenerCities.length)];
          sendGoodVibe(randomEmoji, false);
          if (Math.random() > 0.6) {
            say(`A listener in ${randomCity} sent a cozy ${randomEmoji} vibe`);
          }
        }
      }, 18000);
    })();

    // ==========================================================================
    // MARK: - Procedural Web Audio Lo-Fi Synthesizer (Sandbox Safe)
    // ==========================================================================
    class ProceduralLofiEngine {
      constructor() {
        this.audioContext = null;
        this.masterGain = null;
        this.isPlaying = false;
        this.bpm = 76;
        this.step = 0;
        this.timerId = null;
        this.currentTrackIndex = 0;
        this.trackDuration = 192; // 3m 12s
        this.trackElapsed = 0;
        this.trackIntervalId = null;

        this.tracks = [
          { title: 'Compile Time', artist: 'Midnight Merge' },
          { title: 'Echoes in RAM', artist: 'Terminal Glow' },
          { title: 'Velvet Keycaps', artist: 'Lofi Code Radio' },
          { title: 'Late Night Push', artist: 'Git Rebase' },
          { title: 'Infinite Loop', artist: 'Chillhop Dev' },
          { title: 'Coffee & Commits', artist: 'Sublime Dreams' },
          { title: 'Silent Refactor', artist: 'Cyber Blossom' },
          { title: 'Sunset Syntax', artist: 'Quiet Workspace' }
        ];

        this.progressions = [
          [
            [51, 58, 62, 65, 70], // Ebmaj9
            [48, 55, 60, 63, 67], // Cm9
            [53, 60, 63, 67, 70], // Fm9
            [46, 54, 58, 62, 67]  // Bb13
          ],
          [
            [48, 55, 59, 64, 67], // Cmaj7
            [45, 52, 57, 60, 64], // Am9
            [50, 57, 60, 64, 69], // Dm9
            [43, 50, 55, 59, 65]  // G13
          ],
          [
            [53, 60, 64, 67, 72], // Fmaj7
            [52, 59, 62, 67, 71], // Em7
            [50, 57, 60, 64, 69], // Dm9
            [48, 55, 59, 64, 67]  // Cmaj7
          ]
        ];
        this.progIndex = 0;
      }

      init() {
        if (!this.audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.audioContext = new AudioContextClass();
          this.masterGain = this.audioContext.createGain();
          const initialVolume = $('vol') ? parseFloat($('vol').value) / 100 : 0.7;
          this.masterGain.gain.setValueAtTime(initialVolume, this.audioContext.currentTime);

          const lowpassFilter = this.audioContext.createBiquadFilter();
          lowpassFilter.type = 'lowpass';
          lowpassFilter.frequency.setValueAtTime(2400, this.audioContext.currentTime);
          lowpassFilter.Q.setValueAtTime(1.1, this.audioContext.currentTime);

          this.masterGain.connect(lowpassFilter);
          lowpassFilter.connect(this.audioContext.destination);

          this.startVinylBed();
        }
        if (this.audioContext.state === 'suspended') {
          this.audioContext.resume();
        }
      }

      setVolume(volumeLevel) {
        if (this.masterGain && this.audioContext) {
          this.masterGain.gain.setValueAtTime(volumeLevel, this.audioContext.currentTime);
        }
      }

      startVinylBed() {
        if (!this.audioContext) return;
        const bufferSize = this.audioContext.sampleRate * 2;
        const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
        const channelData = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          channelData[i] = (Math.random() < 0.001) ? (Math.random() * 2 - 1) * 0.35 : (Math.random() * 2 - 1) * 0.012;
        }
        const noiseSource = this.audioContext.createBufferSource();
        noiseSource.buffer = buffer;
        noiseSource.loop = true;
        const filter = this.audioContext.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1600;
        const gainNode = this.audioContext.createGain();
        gainNode.gain.value = 0.08;
        noiseSource.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(this.masterGain);
        noiseSource.start();
      }

      playChord(notes, duration) {
        if (!this.audioContext) return;
        const now = this.audioContext.currentTime;
        notes.forEach((midiNote, idx) => {
          const frequency = 440 * Math.pow(2, (midiNote - 69) / 12);
          const oscillator = this.audioContext.createOscillator();
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(frequency, now);

          const lfo = this.audioContext.createOscillator();
          const lfoGain = this.audioContext.createGain();
          lfo.frequency.value = 4.0 + (idx * 0.2);
          lfoGain.gain.value = 1.0;
          lfo.connect(oscillator.frequency);
          lfo.start(now);
          lfo.stop(now + duration);

          const bellHarmonic = this.audioContext.createOscillator();
          bellHarmonic.type = 'sine';
          bellHarmonic.frequency.setValueAtTime(frequency * 2, now);

          const voiceGain = this.audioContext.createGain();
          const velocity = 0.065 + Math.random() * 0.02;
          voiceGain.gain.setValueAtTime(0, now);
          voiceGain.gain.linearRampToValueAtTime(velocity, now + 0.03 + (idx * 0.012));
          voiceGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          const voiceFilter = this.audioContext.createBiquadFilter();
          voiceFilter.type = 'lowpass';
          voiceFilter.frequency.setValueAtTime(1300, now);

          oscillator.connect(voiceFilter);
          bellHarmonic.connect(voiceFilter);
          voiceFilter.connect(voiceGain);
          voiceGain.connect(this.masterGain);

          oscillator.start(now);
          bellHarmonic.start(now);
          oscillator.stop(now + duration + 0.1);
          bellHarmonic.stop(now + duration + 0.1);
        });

        const rootNote = notes[0] - 12;
        const bassFrequency = 440 * Math.pow(2, (rootNote - 69) / 12);
        const bassOscillator = this.audioContext.createOscillator();
        const bassGain = this.audioContext.createGain();
        bassOscillator.type = 'sine';
        bassOscillator.frequency.setValueAtTime(bassFrequency, now);
        bassGain.gain.setValueAtTime(0, now);
        bassGain.gain.linearRampToValueAtTime(0.18, now + 0.04);
        bassGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.92);
        bassOscillator.connect(bassGain);
        bassGain.connect(this.masterGain);
        bassOscillator.start(now);
        bassOscillator.stop(now + duration);
      }

      playKick() {
        if (!this.audioContext) return;
        const now = this.audioContext.currentTime;
        const oscillator = this.audioContext.createOscillator();
        const gainNode = this.audioContext.createGain();
        oscillator.frequency.setValueAtTime(115, now);
        oscillator.frequency.exponentialRampToValueAtTime(36, now + 0.18);
        gainNode.gain.setValueAtTime(0.35, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        oscillator.connect(gainNode);
        gainNode.connect(this.masterGain);
        oscillator.start(now);
        oscillator.stop(now + 0.26);
      }

      playSnare() {
        if (!this.audioContext) return;
        const now = this.audioContext.currentTime;
        const oscillator = this.audioContext.createOscillator();
        const toneGain = this.audioContext.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(170, now);
        oscillator.frequency.exponentialRampToValueAtTime(65, now + 0.09);
        toneGain.gain.setValueAtTime(0.18, now);
        toneGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        oscillator.connect(toneGain);
        toneGain.connect(this.masterGain);
        oscillator.start(now);
        oscillator.stop(now + 0.12);

        const bufferSize = this.audioContext.sampleRate * 0.12;
        const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noiseSource = this.audioContext.createBufferSource();
        noiseSource.buffer = buffer;
        const filter = this.audioContext.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1350;
        const noiseGain = this.audioContext.createGain();
        noiseGain.gain.setValueAtTime(0.15, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        noiseSource.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.masterGain);
        noiseSource.start(now);
      }

      playHiHat() {
        if (!this.audioContext) return;
        const now = this.audioContext.currentTime;
        const bufferSize = this.audioContext.sampleRate * 0.04;
        const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noiseSource = this.audioContext.createBufferSource();
        noiseSource.buffer = buffer;
        const filter = this.audioContext.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 7200;
        const gainNode = this.audioContext.createGain();
        gainNode.gain.setValueAtTime(0.045 + Math.random() * 0.02, now);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
        noiseSource.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(this.masterGain);
        noiseSource.start(now);
      }

      tick() {
        const step = this.step % 16;
        const progression = this.progressions[this.progIndex];
        const chordIndex = Math.floor(step / 4);
        if (step % 4 === 0) {
          const stepSeconds = (60 / this.bpm) * 0.25;
          this.playChord(progression[chordIndex], stepSeconds * 4 * 0.94);
        }
        if (step === 0 || step === 6 || step === 10) this.playKick();
        if (step === 4 || step === 12) this.playSnare();
        if (step % 2 === 0 && Math.random() > 0.06) this.playHiHat();

        this.step++;
        if (this.step >= 64) {
          this.step = 0;
          if (Math.random() < 0.45) this.progIndex = (this.progIndex + 1) % this.progressions.length;
        }
      }

      start() {
        this.init();
        this.isPlaying = true;
        const stepMs = (60 / this.bpm / 4) * 1000;
        clearInterval(this.timerId);
        this.timerId = setInterval(() => this.tick(), stepMs);

        clearInterval(this.trackIntervalId);
        this.trackIntervalId = setInterval(() => {
          this.trackElapsed += 1;
          $('t0').textContent = fm(this.trackElapsed);
          $('t1').textContent = fm(this.trackDuration);
          $('bar').style.width = ((this.trackElapsed / this.trackDuration) * 100) + '%';
          if (this.trackElapsed >= this.trackDuration) {
            this.next();
          }
        }, 1000);

        this.updateUI();
      }

      stop() {
        this.isPlaying = false;
        clearInterval(this.timerId);
        clearInterval(this.trackIntervalId);
      }

      next() {
        this.currentTrackIndex = (this.currentTrackIndex + 1) % this.tracks.length;
        this.trackElapsed = 0;
        this.progIndex = Math.floor(Math.random() * this.progressions.length);
        this.updateUI();
      }

      prev() {
        this.currentTrackIndex = (this.currentTrackIndex - 1 + this.tracks.length) % this.tracks.length;
        this.trackElapsed = 0;
        this.updateUI();
      }

      seek(ratio) {
        this.trackElapsed = Math.floor(this.trackDuration * ratio);
        $('t0').textContent = fm(this.trackElapsed);
        $('bar').style.width = (ratio * 100) + '%';
      }

      updateUI() {
        const current = this.tracks[this.currentTrackIndex];
        $('title').textContent = current.title;
        $('artist').textContent = current.artist + ' · Lo-Fi Chill';
        $('like').textContent = liked.has(current.title) ? '♥' : '♡';
      }
    }

    const synthEngine = new ProceduralLofiEngine();

    // ==========================================================================
    // MARK: - Chillify Stream and Master Audio Coordinator
    // ==========================================================================
    const API = 'https://chillify.me/api/v1', TRK = 'https://chillify.me/tracks/';
    const GEN = [
      ['chill', 'Lo-Fi Chill']
    ];

    const ls = { get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} } };
    const uid = ls.get('cr_uuid') || (() => { const u = crypto.randomUUID(); ls.set('cr_uuid', u); return u; })(), sid = crypto.randomUUID();
    let genre = 'chill';
    let tracks = [], idx = 0, hist = [], liked = new Set();
    let activeMode = 'chillify';

    const audio = new Audio();
    audio.preload = 'auto';
    audio.volume = 0.7;

    const pretty = t => t.split('/').pop().replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const gname = () => (GEN.find(g => g[0] === genre) || ['', ''])[1];

    $('genre').innerHTML = GEN.map(([k, n]) => `<option value="${k}"${k === genre ? ' selected' : ''}>${n}</option>`).join('');

    async function api(path, body, method) {
      const response = await fetch(API + path, body ? { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
      if (!response.ok) throw new Error(response.status);
      return response.json();
    }

    async function loadTracks() {
      const data = await api(`/tracks?folder=${genre}&userUuid=${uid}`);
      tracks = data.tracks || [];
      liked = new Set(data.likedTracks || []);
      if (!tracks.length) throw new Error('empty');
    }

    function refresh() {
      if (activeMode === 'synth') {
        synthEngine.updateUI();
        return;
      }
      const track = tracks[idx] || '';
      $('title').textContent = track ? pretty(track) : 'Press play to tune in';
      $('artist').textContent = 'Chillify · ' + gname();
      $('like').textContent = track && liked.has(track) ? '♥' : '♡';
      $('hist').innerHTML = hist.slice(-5, -1).reverse().map(h => `<li><span><b>${pretty(h)}</b></span></li>`).join('') || '<li>Nothing played yet</li>';
    }

    const go = (i, t) => {
      idx = i;
      audio.src = TRK + encodeURI(t);
      refresh();
      return audio.play();
    };

    function randomTrack() {
      const randomIdx = Math.floor(Math.random() * tracks.length);
      hist.push(tracks[randomIdx]);
      return go(randomIdx, tracks[randomIdx]);
    }

    async function nextTrack() {
      if (activeMode === 'synth') {
        synthEngine.next();
        return;
      }
      if (!tracks.length) return;
      try {
        const data = await api('/next-track', { sessionId: sid, tracks, currentTrackIndex: idx, shuffle: true, playHistory: hist });
        if (data.success) {
          hist = data.playHistory || hist;
          return go(data.nextIndex, data.nextTrack);
        }
      } catch(e) {}
      return randomTrack();
    }

    async function prevTrack() {
      if (activeMode === 'synth') {
        synthEngine.prev();
        return;
      }
      if (!tracks.length) return;
      try {
        const data = await api('/previous-track', { sessionId: sid, tracks, currentTrackIndex: idx });
        if (data.success) {
          hist.push(data.previousTrack);
          return go(data.previousIndex, data.previousTrack);
        }
      } catch(e) {}
    }

    const fallbackToSynth = reason => {
      activeMode = 'synth';
      audio.pause();
      synthEngine.start();
      document.body.classList.add('playing');
      $('ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
      say(reason || 'Playing built-in Lo-Fi Engine (sandbox mode) 🎧');
    };

    const fail = err => {
      if (err && err.name !== 'AbortError') {
        console.warn('Chillify stream unavailable in sandbox:', err);
        fallbackToSynth('Sandbox mode: playing built-in Lo-Fi Chill 🎧');
      }
    };

    $('play').onclick = async () => {
      if (activeMode === 'synth') {
        if (synthEngine.isPlaying) {
          synthEngine.stop();
          document.body.classList.remove('playing');
          $('ico').innerHTML = '<path d="M8 5v14l11-7z"/>';
        } else {
          synthEngine.start();
          document.body.classList.add('playing');
          $('ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
        }
        return;
      }

      if (!audio.paused) {
        audio.pause();
        return;
      }
      try {
        if (!tracks.length) {
          await loadTracks();
          await randomTrack();
        } else {
          await audio.play();
        }
      } catch(e) {
        fail(e);
      }
    };

    $('next').onclick = () => {
      if (activeMode === 'synth') {
        synthEngine.next();
      } else {
        nextTrack().catch(fail);
      }
    };

    $('prev').onclick = () => {
      if (activeMode === 'synth') {
        synthEngine.prev();
      } else {
        prevTrack().catch(fail);
      }
    };

    $('like').onclick = async () => {
      if (activeMode === 'synth') {
        const currentTitle = synthEngine.getCurrentTrack().title;
        const isLiked = !liked.has(currentTitle);
        isLiked ? liked.add(currentTitle) : liked.delete(currentTitle);
        refresh();
        say(isLiked ? 'Added to liked tracks ♥' : 'Removed from likes');
        return;
      }
      const currentTrack = tracks[idx];
      if (!currentTrack) return;
      const isLiked = !liked.has(currentTrack);
      isLiked ? liked.add(currentTrack) : liked.delete(currentTrack);
      refresh();
      try {
        await api('/likes', { userUuid: uid, trackName: currentTrack, genre: currentTrack.split('/')[0] }, isLiked ? 'POST' : 'DELETE');
      } catch(e) {
        isLiked ? liked.delete(currentTrack) : liked.add(currentTrack);
        refresh();
      }
    };

    audio.onplay = () => {
      document.body.classList.add('playing');
      $('ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
      $('play').setAttribute('aria-label', 'Pause');
    };

    audio.onpause = () => {
      if (activeMode !== 'synth') {
        document.body.classList.remove('playing');
        $('ico').innerHTML = '<path d="M8 5v14l11-7z"/>';
        $('play').setAttribute('aria-label', 'Play');
      }
    };

    audio.onended = () => nextTrack().catch(fail);
    audio.onerror = () => fail({ name: 'AudioError', message: 'Failed to load remote track' });

    audio.ontimeupdate = () => {
      if (activeMode !== 'synth') {
        $('t0').textContent = fm(audio.currentTime);
        $('t1').textContent = fm(audio.duration);
        $('bar').style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + '%';
      }
    };

    const trackBar = document.querySelector('.track');
    trackBar.onclick = e => {
      const rect = trackBar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (activeMode === 'synth') {
        synthEngine.seek(ratio);
      } else if (audio.duration) {
        audio.currentTime = ratio * audio.duration;
      }
    };

    $('vol').oninput = e => {
      const volumeLevel = e.target.value / 100;
      audio.volume = volumeLevel;
      synthEngine.setVolume(volumeLevel);
    };

    $('hbtn').onclick = () => $('hist').classList.toggle('open');

    // Initial setup
    refresh();
    $('t0').textContent = '0:00';
    $('t1').textContent = '3:12';
  </script>
</body>
</html>
