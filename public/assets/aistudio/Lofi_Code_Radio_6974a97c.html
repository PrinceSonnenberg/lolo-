*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#1d1a2b;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overflow:hidden}
.scene{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;width:var(--W);height:var(--W);left:calc((100vw - var(--W))*.66);top:calc((100vh - var(--W))*.42);transform-origin:66% 55%;animation:breathe 30s ease-in-out infinite alternate}
.base{position:absolute;inset:0;background:var(--img) center/100% 100%}
.stage>*{pointer-events:none}
.abs{position:absolute;transform:translate(-50%,-50%)}
@keyframes breathe{to{transform:scale(1.035)}}
/* string lights */
.bulb{border-radius:50%;background:radial-gradient(circle,#fff7cf 0 14%,rgba(255,206,120,.6) 32%,transparent 70%);mix-blend-mode:screen;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;scale:.8}50%{opacity:1;scale:1.15}}
.lamp{border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.55),rgba(255,190,110,.18) 45%,transparent 70%);mix-blend-mode:screen;animation:lamp 5s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.55}50%{opacity:.9}}
/* city */
.cl{border-radius:2px;background:#ffbe85;box-shadow:0 0 8px 3px rgba(255,170,100,.55);mix-blend-mode:screen;animation:fl 4s steps(1) infinite}
@keyframes fl{0%{opacity:.9}20%{opacity:.25}35%{opacity:.8}60%{opacity:.5}80%{opacity:1}}
/* window sky */
.win{position:absolute;left:7%;top:0;width:44.5%;height:55%;overflow:hidden}
.cloud{position:absolute;width:60%;height:22%;border-radius:50%;filter:blur(22px);mix-blend-mode:screen;opacity:.45;background:linear-gradient(90deg,transparent,#ffd9e4 40%,#fff 60%,transparent);animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-90%)}to{transform:translateX(190%)}}
.win canvas{position:absolute;inset:0;width:100%;height:100%}
/* steam */
.steam{width:2.2%;height:5%;border-radius:50%;filter:blur(5px);background:rgba(255,255,255,.55);animation:rise 4.5s ease-out infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.6)}25%{opacity:.5}100%{opacity:0;transform:translate(-30%,-420%) scale(1.5)}}
/* laptop */
.screen{position:absolute;left:24.4%;top:45.5%;width:19.7%;height:16.6%;overflow:hidden;background:#171c2a;clip-path:polygon(0 12.9%,84.2% 0,100% 83.5%,20.8% 100%)}
.code{position:absolute;left:8%;top:0;width:100%;transform:rotate(-7deg);transform-origin:0 0;font:700 5.5px/8px 'JetBrains Mono',monospace;white-space:pre;animation:scroll 18s linear infinite}
@keyframes scroll{to{transform:rotate(-7deg) translateY(-50%)}}
.code i{font-style:normal}
/* sway */
.sway{position:absolute;background-image:var(--img);-webkit-mask-image:radial-gradient(ellipse at center,#000 52%,transparent 74%);mask-image:radial-gradient(ellipse at center,#000 52%,transparent 74%)}
@keyframes sw{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
/* shade for UI legibility */
.shade{position:fixed;inset:0;background:linear-gradient(to top,rgba(20,14,34,.82),rgba(20,14,34,0) 42%),linear-gradient(to bottom,rgba(20,14,34,.45),transparent 18%);pointer-events:none}
/* UI */
.top{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.brand b{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;color:var(--mute)}
.live{width:8px;height:8px;border-radius:50%;background:#ff6b6b;animation:tw 1.6s infinite}
.player{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100vw - 24px));background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:14px}
.row{display:flex;align-items:center;gap:14px}
.art{position:relative;flex:none;width:68px;height:68px;border-radius:14px;background:var(--img) -127px -29px/272px auto no-repeat;overflow:hidden}
.bars{position:absolute;left:6px;bottom:6px;display:flex;gap:2px;align-items:flex-end;height:16px}
.bars span{width:3px;height:3px;background:#fff;border-radius:1px}
.playing .bars span{animation:eq .9s ease-in-out infinite alternate}
.bars span:nth-child(2){animation-delay:-.3s!important}.bars span:nth-child(3){animation-delay:-.6s!important}.bars span:nth-child(4){animation-delay:-.15s!important}
@keyframes eq{to{height:16px}}
.meta{min-width:0;flex:1}
.title{font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#2a1b2e;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.play:hover{transform:scale(1.06)}
.play:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.play svg{width:24px;height:24px;fill:currentColor}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font:400 12px 'JetBrains Mono',monospace;color:var(--mute)}
.track{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent)}
.vol{width:84px;accent-color:var(--accent)}
.btn{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:8px}
.btn:hover{color:var(--ink)}
.hist{display:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid rgba(255,255,255,.12);list-style:none;font-size:14px}
.hist.open{display:block}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--mute)}
.hist li b{color:var(--ink);font-weight:700}
.note{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;color:var(--mute);background:var(--glass);padding:6px 12px;border-radius:99px;opacity:0;transition:opacity .3s;white-space:nowrap}
.note.show{opacity:1}
@media (max-width:520px){.vol,.hide-s{display:none}.title{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.stage{position:absolute;--Wd:max(100vw,177.87vh);width:var(--Wd);height:calc(var(--Wd)/1.7787);left:calc((100vw - var(--Wd))*.6);top:calc((100vh - var(--Wd)/1.7787)*.4);transform-origin:62% 55%;animation:breathe 40s ease-in-out infinite alternate}
.pane{position:absolute;overflow:hidden;pointer-events:none}
.cloud{background:linear-gradient(90deg,transparent,#ffc9a6 40%,#fff0e4 60%,transparent);opacity:.32}
.fog{position:absolute;left:0;top:62%;width:70%;height:28%;border-radius:50%;filter:blur(22px);mix-blend-mode:screen;opacity:.2;background:linear-gradient(90deg,transparent,#e9e2ff 45%,#fff 60%,transparent);animation:drift 120s linear infinite}
.stage canvas.dust{position:absolute;left:0;top:0;width:47.5%;height:60.6%}
#typing{position:absolute}
.brz{animation:br 4.2s ease-in-out infinite}
.steam{width:1.1%!important;height:4.8%!important}
.pill select{background:none;border:0;color:inherit;font:inherit;cursor:pointer;max-width:46vw}.pill select option{color:#222}.ctl{display:flex;gap:2px;margin-top:6px;align-items:center}.ctl .sp{flex:1}.ctl .btn{padding:6px 10px}.track{cursor:pointer}.player{width:min(540px,calc(100vw - 24px));padding:10px 12px;border-radius:18px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.row{gap:8px}.art{width:46px;height:46px;border-radius:10px;background-size:184px auto;background-position:-86px -20px}
.title{font-size:15px}.artist{font-size:12.5px}
.play{width:40px;height:40px}.play svg{width:19px;height:19px}
.ic{font-size:17px;padding:6px 7px;line-height:1}
.vol{width:64px}.prog{margin-top:8px;font-size:11px;gap:8px}.prog .btn{padding:2px 4px;font-size:12px}
.note{z-index:30;width:max-content;max-width:min(520px,calc(100vw - 24px));white-space:normal;text-align:center;line-height:1.4;background:rgba(28,22,44,.94);border:1px solid rgba(255,255,255,.18);color:#f7efe4;padding:10px 14px;border-radius:14px}

// ============================================================================
// MARK: - Built-in Sandbox-Safe Procedural Lo-Fi Music Synthesizer
// ============================================================================

class ProceduralLofiEngine {
  constructor() {
    this.audioContext = null;
    this.masterGain = null;
    this.isPlaying = false;
    this.bpm = 76;
    this.step = 0;
    this.timerId = null;
    this.currentTrackIndex = 0;
    this.trackDuration = 192; // 3m 12s
    this.trackElapsed = 0;
    this.trackIntervalId = null;

    this.tracks = [
      { title: 'Compile Time', artist: 'Midnight Merge' },
      { title: 'Echoes in RAM', artist: 'Terminal Glow' },
      { title: 'Velvet Keycaps', artist: 'Lofi Code Radio' },
      { title: 'Late Night Push', artist: 'Git Rebase' },
      { title: 'Infinite Loop', artist: 'Chillhop Dev' },
      { title: 'Coffee & Commits', artist: 'Sublime Dreams' },
      { title: 'Silent Refactor', artist: 'Cyber Blossom' },
      { title: 'Sunset Syntax', artist: 'Quiet Workspace' }
    ];

    this.progressions = [
      [
        [51, 58, 62, 65, 70], // Ebmaj9
        [48, 55, 60, 63, 67], // Cm9
        [53, 60, 63, 67, 70], // Fm9
        [46, 54, 58, 62, 67]  // Bb13
      ],
      [
        [48, 55, 59, 64, 67], // Cmaj7
        [45, 52, 57, 60, 64], // Am9
        [50, 57, 60, 64, 69], // Dm9
        [43, 50, 55, 59, 65]  // G13
      ],
      [
        [53, 60, 64, 67, 72], // Fmaj7
        [52, 59, 62, 67, 71], // Em7
        [50, 57, 60, 64, 69], // Dm9
        [48, 55, 59, 64, 67]  // Cmaj7
      ]
    ];
    this.progIndex = 0;
  }

  init() {
    if (!this.audioContext) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.audioContext = new AC();
      this.masterGain = this.audioContext.createGain();
      const volInput = $('vol') ? parseFloat($('vol').value) / 100 : 0.7;
      this.masterGain.gain.setValueAtTime(volInput, this.audioContext.currentTime);

      const lp = this.audioContext.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(2400, this.audioContext.currentTime);
      lp.Q.setValueAtTime(1.1, this.audioContext.currentTime);

      this.masterGain.connect(lp);
      lp.connect(this.audioContext.destination);

      this.startVinylBed();
    }
    if (this.audioContext.state === 'suspended') {
      this.audioContext.resume();
    }
  }

  setVolume(v) {
    if (this.masterGain && this.audioContext) {
      this.masterGain.gain.setValueAtTime(v, this.audioContext.currentTime);
    }
  }

  startVinylBed() {
    if (!this.audioContext) return;
    const bufSize = this.audioContext.sampleRate * 2;
    const buf = this.audioContext.createBuffer(1, bufSize, this.audioContext.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      d[i] = (Math.random() < 0.001) ? (Math.random() * 2 - 1) * 0.35 : (Math.random() * 2 - 1) * 0.012;
    }
    const src = this.audioContext.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const flt = this.audioContext.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = 1600;
    const g = this.audioContext.createGain();
    g.gain.value = 0.08;
    src.connect(flt);
    flt.connect(g);
    g.connect(this.masterGain);
    src.start();
  }

  playChord(notes, dur) {
    if (!this.audioContext) return;
    const now = this.audioContext.currentTime;
    notes.forEach((m, idx) => {
      const f = 440 * Math.pow(2, (m - 69) / 12);
      const osc = this.audioContext.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now);

      const lfo = this.audioContext.createOscillator();
      const lfoG = this.audioContext.createGain();
      lfo.frequency.value = 4.0 + (idx * 0.2);
      lfoG.gain.value = 1.0;
      lfo.connect(osc.frequency);
      lfo.start(now);
      lfo.stop(now + dur);

      const bell = this.audioContext.createOscillator();
      bell.type = 'sine';
      bell.frequency.setValueAtTime(f * 2, now);

      const vG = this.audioContext.createGain();
      const vel = 0.065 + Math.random() * 0.02;
      vG.gain.setValueAtTime(0, now);
      vG.gain.linearRampToValueAtTime(vel, now + 0.03 + (idx * 0.012));
      vG.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      const vF = this.audioContext.createBiquadFilter();
      vF.type = 'lowpass';
      vF.frequency.setValueAtTime(1300, now);

      osc.connect(vF);
      bell.connect(vF);
      vF.connect(vG);
      vG.connect(this.masterGain);

      osc.start(now);
      bell.start(now);
      osc.stop(now + dur + 0.1);
      bell.stop(now + dur + 0.1);
    });

    // Sub bass tone
    const root = notes[0] - 12;
    const bf = 440 * Math.pow(2, (root - 69) / 12);
    const bOsc = this.audioContext.createOscillator();
    const bG = this.audioContext.createGain();
    bOsc.type = 'sine';
    bOsc.frequency.setValueAtTime(bf, now);
    bG.gain.setValueAtTime(0, now);
    bG.gain.linearRampToValueAtTime(0.18, now + 0.04);
    bG.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.92);
    bOsc.connect(bG);
    bG.connect(this.masterGain);
    bOsc.start(now);
    bOsc.stop(now + dur);
  }

  playKick() {
    if (!this.audioContext) return;
    const now = this.audioContext.currentTime;
    const osc = this.audioContext.createOscillator();
    const g = this.audioContext.createGain();
    osc.frequency.setValueAtTime(115, now);
    osc.frequency.exponentialRampToValueAtTime(36, now + 0.18);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g);
    g.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + 0.26);
  }

  playSnare() {
    if (!this.audioContext) return;
    const now = this.audioContext.currentTime;
    const osc = this.audioContext.createOscillator();
    const og = this.audioContext.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(170, now);
    osc.frequency.exponentialRampToValueAtTime(65, now + 0.09);
    og.gain.setValueAtTime(0.18, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
    osc.connect(og);
    og.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + 0.12);

    const bufSize = this.audioContext.sampleRate * 0.12;
    const buf = this.audioContext.createBuffer(1, bufSize, this.audioContext.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
    const noise = this.audioContext.createBufferSource();
    noise.buffer = buf;
    const filter = this.audioContext.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1350;
    const ng = this.audioContext.createGain();
    ng.gain.setValueAtTime(0.15, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    noise.connect(filter);
    filter.connect(ng);
    ng.connect(this.masterGain);
    noise.start(now);
  }

  playHiHat() {
    if (!this.audioContext) return;
    const now = this.audioContext.currentTime;
    const bufSize = this.audioContext.sampleRate * 0.04;
    const buf = this.audioContext.createBuffer(1, bufSize, this.audioContext.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
    const noise = this.audioContext.createBufferSource();
    noise.buffer = buf;
    const flt = this.audioContext.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.value = 7200;
    const g = this.audioContext.createGain();
    g.gain.setValueAtTime(0.045 + Math.random() * 0.02, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
    noise.connect(flt);
    flt.connect(g);
    g.connect(this.masterGain);
    noise.start(now);
  }

  tick() {
    const s = this.step % 16;
    const prog = this.progressions[this.progIndex];
    const cIdx = Math.floor(s / 4);
    if (s % 4 === 0) {
      const stepSec = (60 / this.bpm) * 0.25;
      this.playChord(prog[cIdx], stepSec * 4 * 0.94);
    }
    if (s === 0 || s === 6 || s === 10) this.playKick();
    if (s === 4 || s === 12) this.playSnare();
    if (s % 2 === 0 && Math.random() > 0.06) this.playHiHat();

    this.step++;
    if (this.step >= 64) {
      this.step = 0;
      if (Math.random() < 0.45) this.progIndex = (this.progIndex + 1) % this.progressions.length;
    }
  }

  start() {
    this.init();
    this.isPlaying = true;
    const stepMs = (60 / this.bpm / 4) * 1000;
    clearInterval(this.timerId);
    this.timerId = setInterval(() => this.tick(), stepMs);

    clearInterval(this.trackIntervalId);
    this.trackIntervalId = setInterval(() => {
      this.trackElapsed += 1;
      $('t0').textContent = fm(this.trackElapsed);
      $('t1').textContent = fm(this.trackDuration);
      $('bar').style.width = ((this.trackElapsed / this.trackDuration) * 100) + '%';
      if (this.trackElapsed >= this.trackDuration) {
        this.next();
      }
    }, 1000);

    this.updateUI();
  }

  stop() {
    this.isPlaying = false;
    clearInterval(this.timerId);
    clearInterval(this.trackIntervalId);
  }

  next() {
    this.currentTrackIndex = (this.currentTrackIndex + 1) % this.tracks.length;
    this.trackElapsed = 0;
    this.progIndex = Math.floor(Math.random() * this.progressions.length);
    this.updateUI();
  }

  prev() {
    this.currentTrackIndex = (this.currentTrackIndex - 1 + this.tracks.length) % this.tracks.length;
    this.trackElapsed = 0;
    this.updateUI();
  }

  seek(ratio) {
    this.trackElapsed = Math.floor(this.trackDuration * ratio);
    $('t0').textContent = fm(this.trackElapsed);
    $('bar').style.width = (ratio * 100) + '%';
  }

  updateUI() {
    const cur = this.tracks[this.currentTrackIndex];
    $('title').textContent = cur.title;
    $('artist').textContent = cur.artist + ' · Lo-Fi Beats';
    $('like').textContent = liked.has(cur.title) ? '♥' : '♡';
  }
}

const synthEngine = new ProceduralLofiEngine();

// ============================================================================
// MARK: - Chillify Stream and Master Audio Coordinator
// ============================================================================

const API = 'https://chillify.me/api/v1', TRK = 'https://chillify.me/tracks/';
const GEN = [
  ['synth', '✨ Lo-Fi Beats (Sandbox Safe)'],
  ['chill', 'Chillify: Lo-Fi Chill'],
  ['cafe', 'Chillify: Chill Cafe'],
  ['asian', 'Chillify: Asian Jazzy'],
  ['jazzy', 'Chillify: Jazzy'],
  ['soft_indie_dnb', 'Chillify: Soft Indie DnB'],
  ['rock', 'Chillify: Rock'],
  ['pop_punk', 'Chillify: Pop Punk'],
  ['mix', 'Chillify: Mix']
];

const ls = { get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} } };
const uid = ls.get('cr_uuid') || (() => { const u = crypto.randomUUID(); ls.set('cr_uuid', u); return u; })(), sid = crypto.randomUUID();
let genre = ls.get('cr_genre') || 'synth';
let tracks = [], idx = 0, hist = [], liked = new Set();
let activeMode = (genre === 'synth') ? 'synth' : 'chillify';

const audio = new Audio();
audio.preload = 'auto';
audio.volume = 0.7;

const fm = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
const say = m => {
  const n = $('note');
  n.textContent = m;
  n.style.bottom = ($('player').offsetHeight + 24) + 'px';
  n.classList.add('show');
  clearTimeout(say.t);
  say.t = setTimeout(() => n.classList.remove('show'), 6000);
};

const pretty = t => t.split('/').pop().replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const gname = () => (GEN.find(g => g[0] === genre) || ['', ''])[1];

$('genre').innerHTML = GEN.map(([k, n]) => `<option value="${k}"${k === genre ? ' selected' : ''}>${n}</option>`).join('');

async function api(path, body, method) {
  const r = await fetch(API + path, body ? { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadTracks() {
  const d = await api(`/tracks?folder=${genre}${genre === 'mix' ? '&include=chill,cafe,jazzy' : ''}&userUuid=${uid}`);
  tracks = d.tracks || [];
  liked = new Set(d.likedTracks || []);
  if (!tracks.length) throw new Error('empty');
}

function refresh() {
  if (activeMode === 'synth') {
    synthEngine.updateUI();
    return;
  }
  const t = tracks[idx] || '';
  $('title').textContent = t ? pretty(t) : 'Press play to tune in';
  $('artist').textContent = 'Chillify · ' + gname();
  $('like').textContent = t && liked.has(t) ? '♥' : '♡';
  $('hist').innerHTML = hist.slice(-5, -1).reverse().map(h => `<li><span><b>${pretty(h)}</b></span></li>`).join('') || '<li>Nothing played yet</li>';
}

const go = (i, t) => {
  idx = i;
  audio.src = TRK + encodeURI(t);
  refresh();
  return audio.play();
};

function randomTrack() {
  const i = Math.floor(Math.random() * tracks.length);
  hist.push(tracks[i]);
  return go(i, tracks[i]);
}

async function nextTrack() {
  if (activeMode === 'synth') {
    synthEngine.next();
    return;
  }
  if (!tracks.length) return;
  try {
    const d = await api('/next-track', { sessionId: sid, tracks, currentTrackIndex: idx, shuffle: true, playHistory: hist });
    if (d.success) {
      hist = d.playHistory || hist;
      return go(d.nextIndex, d.nextTrack);
    }
  } catch(e) {}
  return randomTrack();
}

async function prevTrack() {
  if (activeMode === 'synth') {
    synthEngine.prev();
    return;
  }
  if (!tracks.length) return;
  try {
    const d = await api('/previous-track', { sessionId: sid, tracks, currentTrackIndex: idx });
    if (d.success) {
      hist.push(d.previousTrack);
      return go(d.previousIndex, d.previousTrack);
    }
  } catch(e) {}
}

const fallbackToSynth = (reason) => {
  activeMode = 'synth';
  audio.pause();
  synthEngine.start();
  document.body.classList.add('playing');
  $('ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  say(reason || 'Playing built-in Lo-Fi Engine (sandbox mode) 🎧');
};

const fail = e => {
  if (e && e.name !== 'AbortError') {
    console.warn('Chillify stream unavailable in sandbox:', e);
    fallbackToSynth('External stream blocked in preview sandbox: playing built-in Lo-Fi 🎧');
  }
};

$('play').onclick = async () => {
  // If synth engine is currently active
  if (activeMode === 'synth') {
    if (synthEngine.isPlaying) {
      synthEngine.stop();
      document.body.classList.remove('playing');
      $('ico').innerHTML = '<path d="M8 5v14l11-7z"/>';
    } else {
      synthEngine.start();
      document.body.classList.add('playing');
      $('ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    }
    return;
  }

  // Chillify mode
  if (!audio.paused) {
    audio.pause();
    return;
  }
  try {
    if (!tracks.length) {
      await loadTracks();
      await randomTrack();
    } else {
      await audio.play();
    }
  } catch(e) {
    fail(e);
  }
};

$('next').onclick = () => {
  if (activeMode === 'synth') {
    synthEngine.next();
  } else {
    nextTrack().catch(fail);
  }
};

$('prev').onclick = () => {
  if (activeMode === 'synth') {
    synthEngine.prev();
  } else {
    prevTrack().catch(fail);
  }
};

$('like').onclick = async () => {
  if (activeMode === 'synth') {
    const cur = synthEngine.getCurrentTrack().title;
    const on = !liked.has(cur);
    on ? liked.add(cur) : liked.delete(cur);
    refresh();
    say(on ? 'Added to liked tracks ♥' : 'Removed from likes');
    return;
  }
  const t = tracks[idx];
  if (!t) return;
  const on = !liked.has(t);
  on ? liked.add(t) : liked.delete(t);
  refresh();
  try {
    await api('/likes', { userUuid: uid, trackName: t, genre: t.split('/')[0] }, on ? 'POST' : 'DELETE');
  } catch(e) {
    on ? liked.delete(t) : liked.add(t);
    refresh();
  }
};

$('genre').onchange = async e => {
  const newGenre = e.target.value;
  genre = newGenre;
  ls.set('cr_genre', genre);

  if (newGenre === 'synth') {
    audio.pause();
    activeMode = 'synth';
    synthEngine.start();
    document.body.classList.add('playing');
    $('ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    say('Switched to built-in Lo-Fi Engine 🎧');
    return;
  }

  activeMode = 'chillify';
  synthEngine.stop();
  const was = !audio.paused;
  audio.pause();
  tracks = [];
  hist = [];
  idx = 0;
  refresh();
  if (was) {
    try {
      await loadTracks();
      await randomTrack();
    } catch(x) {
      fail(x);
    }
  }
};

audio.onplay = () => {
  document.body.classList.add('playing');
  $('ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  $('play').setAttribute('aria-label', 'Pause');
};

audio.onpause = () => {
  if (activeMode !== 'synth') {
    document.body.classList.remove('playing');
    $('ico').innerHTML = '<path d="M8 5v14l11-7z"/>';
    $('play').setAttribute('aria-label', 'Play');
  }
};

audio.onended = () => nextTrack().catch(fail);
audio.onerror = () => fail({ name: 'AudioError', message: 'Failed to load remote track' });

audio.ontimeupdate = () => {
  if (activeMode !== 'synth') {
    $('t0').textContent = fm(audio.currentTime);
    $('t1').textContent = fm(audio.duration);
    $('bar').style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + '%';
  }
};

const tk = document.querySelector('.track');
tk.onclick = e => {
  const r = tk.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  if (activeMode === 'synth') {
    synthEngine.seek(ratio);
  } else if (audio.duration) {
    audio.currentTime = ratio * audio.duration;
  }
};

$('vol').oninput = e => {
  const v = e.target.value / 100;
  audio.volume = v;
  synthEngine.setVolume(v);
};

$('hbtn').onclick = () => $('hist').classList.toggle('open');

// Initialize view
refresh();
$('t0').textContent = '0:00';
$('t1').textContent = '3:12';
</script></body></html>
